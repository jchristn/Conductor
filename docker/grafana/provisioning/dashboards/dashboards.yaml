# Grafana dashboard provisioning for Conductor.
#
# A single provider places every Conductor dashboard directly into one top-level
# "Conductor" folder (no subfolders). Grafana creates the folder from the `folder`
# option; the dashboards in the mounted directory each land inside it.

apiVersion: 1

providers:
  - name: Conductor
    orgId: 1
    type: file
    folder: Conductor
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/Conductor
