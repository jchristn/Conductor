# Grafana dashboard provisioning for Conductor.
#
# A single provider with foldersFromFilesStructure enabled maps the dashboards
# directory tree onto Grafana's (nested) folder hierarchy. Everything lives under
# a top-level "Conductor" folder, with one subfolder per subsystem (Database,
# HTTP and API, Inference, Routing and Load Balancing, QoS and Queueing, Runtime,
# Health and Endpoints). Nested folders are GA in the Grafana 11.x image used here.

apiVersion: 1

providers:
  - name: Conductor
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
