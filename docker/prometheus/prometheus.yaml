# Prometheus configuration for Conductor.
#
# Scrapes the OpenTelemetry Collector's Prometheus exporter, which is where all
# Conductor OTLP metrics land after conversion to Prometheus format.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Prometheus' own metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Optional: scrape the Conductor server's in-process Prometheus endpoint
  # directly. Enable OpenTelemetry.PrometheusEnabled in conductor.json and
  # uncomment this block to bypass the collector for metrics.
  # - job_name: conductor-direct
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["conductor:9464"]
